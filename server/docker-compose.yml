name: url-shortener-server

services:
  postgres:
    image: postgres:16-alpine
    container_name: url-shortener-server-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: urlshortenerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urlshortenerdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: