name: Client CI

on:
  push:
    branches: [main]
    paths: ['client/mobile/**', '.github/workflows/client.yml']
  pull_request:
    paths: ['client/mobile/**']

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/mobile
    env:
      EXPO_PUBLIC_API_URL: https://example.invalid/api/v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/mobile/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Export web build
        run: npx expo export --platform web
